name: Build APK sur GitHub Actions

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Récupération du code
      # ============================================================
      - name: Checkout le code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configuration de Node.js
      # ============================================================
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      # ============================================================
      # 3. Configuration de Java
      # ============================================================
      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # 4. Installation des dépendances
      # ============================================================
      - name: Installation des dépendances NPM
        run: npm ci


      # ============================================================
      # 5. Génération du projet Android
      #
      # IMPORTANT :
      # Expo SDK 56 (avec @expo/ui / Jetpack Compose) génère lui-même
      # dans android/settings.gradle et android/build.gradle la bonne
      # version de Kotlin, alignée via expoAutolinking.useExpoVersionCatalog()
      # avec toutes les dépendances natives (react-native-gesture-handler,
      # react-native-screens, etc.).
      #
      # NE PAS patcher ces fichiers après coup : forcer une version de
      # Kotlin différente (ex: hardcoder "2.2.21") casse cet alignement
      # et provoque des erreurs de compilation Kotlin difficiles à
      # diagnostiquer dans les modules natifs (ex: "Function invocation
      # 'getRootViewTag()' expected").
      # ============================================================
      - name: Génération des fichiers natifs Android
        run: npx expo prebuild --platform android --clean


      # ============================================================
      # 6. Vérification de la configuration (lecture seule, pour debug)
      # ============================================================
      - name: Vérifier la configuration Android
        run: |
          echo ""
          echo "========================================"
          echo "settings.gradle"
          echo "========================================"
          cat android/settings.gradle

          echo ""
          echo "========================================"
          echo "build.gradle"
          echo "========================================"
          cat android/build.gradle

          echo ""
          echo "========================================"
          echo "app/build.gradle"
          echo "========================================"
          cat android/app/build.gradle


      # ============================================================
      # 7. Rendre Gradle exécutable
      # ============================================================
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew


      # ============================================================
      # 8. Vérifier la version de Gradle
      # ============================================================
      - name: Vérifier Gradle
        working-directory: android
        run: ./gradlew --version


      # ============================================================
      # 9. Nettoyage
      # ============================================================
      - name: Nettoyer le projet Android
        working-directory: android
        run: ./gradlew clean --no-daemon --stacktrace


      # ============================================================
      # 10. Construction de l'APK
      # ============================================================
      - name: Build APK avec Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 11. Vérification de l'APK
      # ============================================================
      - name: Vérifier l'APK généré
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo ""
          echo "========================================"
          echo "VÉRIFICATION DE L'APK"
          echo "========================================"

          if [ -f "$APK" ]; then
            echo ""
            echo "✅ APK généré avec succès !"
            echo ""
            ls -lh "$APK"
          else
            echo ""
            echo "❌ APK introuvable !"
            echo ""
            echo "Fichiers disponibles :"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi


      # ============================================================
      # 12. Upload de l'APK
      # ============================================================
      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
