name: Build APK sur GitHub Actions

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Récupération du code
      # ============================================================
      - name: Checkout le code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configuration de Node.js
      # ============================================================
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      # ============================================================
      # 3. Configuration de Java
      # ============================================================
      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # 4. Installation des dépendances
      # ============================================================
      - name: Installation des dépendances NPM
        run: npm ci


      # ============================================================
      # 5. Génération du projet Android
      # ============================================================
      - name: Génération des fichiers natifs Android
        run: npx expo prebuild --platform android --clean


      # ============================================================
      # 6. Correction de settings.gradle
      #
      # Expo peut générer les plugins Kotlin directement dans
      # settings.gradle. Ils ne doivent pas être appliqués ici.
      # ============================================================
      - name: Corriger settings.gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")

          if not path.exists():
              print("❌ android/settings.gradle introuvable")
              raise SystemExit(1)

          lines = path.read_text().splitlines()

          new_lines = []

          for line in lines:
              stripped = line.strip()

              if stripped in [
                  'apply plugin: "org.jetbrains.kotlin.android"',
                  "apply plugin: 'org.jetbrains.kotlin.android'",
                  'apply plugin: "kotlin-compose"',
                  "apply plugin: 'kotlin-compose'",
              ]:
                  print(f"⚠️ Suppression : {line}")
                  continue

              new_lines.append(line)

          path.write_text("\n".join(new_lines) + "\n")

          print("")
          print("========================================")
          print("settings.gradle APRÈS CORRECTION")
          print("========================================")
          print(path.read_text())
          PY


      # ============================================================
      # 7. Configuration du Compose Compiler
      #
      # IMPORTANT :
      # Le plugin doit être ajouté DANS le bloc plugins {} existant.
      # S'il n'existe pas de bloc plugins {} mais un bloc buildscript {},
      # le nouveau plugins {} doit être placé APRÈS la fin de
      # buildscript {} (Gradle exige buildscript {} avant tout
      # plugins {} dans le script).
      # ============================================================
      - name: Configurer Kotlin Compose Compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle")

          if not path.exists():
              print("❌ android/build.gradle introuvable")
              raise SystemExit(1)

          content = path.read_text()

          plugin = 'id "org.jetbrains.kotlin.plugin.compose" version "2.2.21" apply false'

          if "org.jetbrains.kotlin.plugin.compose" not in content:

              if "plugins {" in content:
                  # Il existe déjà un bloc plugins {} : on ajoute dedans
                  content = content.replace(
                      "plugins {",
                      f'''plugins {{
              {plugin}''',
                      1
                  )

              elif "buildscript {" in content:
                  # Pas de bloc plugins{}, mais un buildscript{} : le
                  # nouveau bloc plugins{} DOIT être placé APRES la fin
                  # de buildscript{}, sinon Gradle refuse le script.
                  start = content.index("buildscript {")
                  depth = 0
                  end = None
                  for i in range(start, len(content)):
                      if content[i] == "{":
                          depth += 1
                      elif content[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break

                  if end is None:
                      print("❌ Impossible de trouver la fin du bloc buildscript {}")
                      raise SystemExit(1)

                  insertion = f'''

          plugins {{
              {plugin}
          }}'''
                  content = content[:end] + insertion + content[end:]

              else:
                  # Ni plugins{}, ni buildscript{} : on peut ajouter en
                  # tête du fichier sans risque de conflit d'ordre.
                  content = f'''plugins {{
              {plugin}
          }}

          ''' + content

          path.write_text(content)

          print("")
          print("========================================")
          print("android/build.gradle APRÈS CORRECTION")
          print("========================================")
          print(content)
          PY


      # ============================================================
      # 8. Configuration du Compose Compiler dans l'application
      # ============================================================
      - name: Configurer Compose Compiler dans app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              print("❌ android/app/build.gradle introuvable")
              raise SystemExit(1)

          content = path.read_text()

          plugin = 'id "org.jetbrains.kotlin.plugin.compose"'

          if plugin not in content:

              if "plugins {" in content:

                  content = content.replace(
                      "plugins {",
                      f'''plugins {{
              {plugin}''',
                      1
                  )

              else:

                  content = f'''plugins {{
              {plugin}
          }}

          ''' + content

          path.write_text(content)

          print("")
          print("========================================")
          print("android/app/build.gradle APRÈS CORRECTION")
          print("========================================")
          print(content)
          PY


      # ============================================================
      # 9. Vérification de la configuration
      # ============================================================
      - name: Vérifier la configuration Android
        run: |
          echo ""
          echo "========================================"
          echo "settings.gradle"
          echo "========================================"
          cat android/settings.gradle

          echo ""
          echo "========================================"
          echo "build.gradle"
          echo "========================================"
          cat android/build.gradle

          echo ""
          echo "========================================"
          echo "app/build.gradle"
          echo "========================================"
          cat android/app/build.gradle


      # ============================================================
      # 10. Vérifier qu'aucun plugin Kotlin incorrect
      # n'est encore appliqué dans settings.gradle
      # ============================================================
      - name: Vérifier settings.gradle
        run: |
          if grep -nE 'apply plugin.*org\.jetbrains\.kotlin\.android' android/settings.gradle; then
            echo ""
            echo "❌ org.jetbrains.kotlin.android est encore présent dans settings.gradle"
            exit 1
          fi

          if grep -nE 'apply plugin.*kotlin-compose' android/settings.gradle; then
            echo ""
            echo "❌ kotlin-compose est encore présent dans settings.gradle"
            exit 1
          fi

          echo ""
          echo "✅ settings.gradle est correct."


      # ============================================================
      # 11. Rendre Gradle exécutable
      # ============================================================
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew


      # ============================================================
      # 12. Vérifier la version de Gradle
      # ============================================================
      - name: Vérifier Gradle
        working-directory: android
        run: ./gradlew --version


      # ============================================================
      # 13. Nettoyage
      # ============================================================
      - name: Nettoyer le projet Android
        working-directory: android
        run: ./gradlew clean --no-daemon --stacktrace


      # ============================================================
      # 14. Construction de l'APK
      # ============================================================
      - name: Build APK avec Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 15. Vérification de l'APK
      # ============================================================
      - name: Vérifier l'APK généré
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo ""
          echo "========================================"
          echo "VÉRIFICATION DE L'APK"
          echo "========================================"

          if [ -f "$APK" ]; then
            echo ""
            echo "✅ APK généré avec succès !"
            echo ""
            ls -lh "$APK"
          else
            echo ""
            echo "❌ APK introuvable !"
            echo ""
            echo "Fichiers disponibles :"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi


      # ============================================================
      # 16. Upload de l'APK
      # ============================================================
      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
