name: Build APK sur GitHub Actions

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du projet
      - name: Checkout le code
        uses: actions/checkout@v4

      # 2. Installation de Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 3. Installation de Java
      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Installation des dépendances
      - name: Installation des dépendances NPM
        run: npm ci

      # 5. Génération du projet Android avec Expo
      - name: Génération des fichiers natifs Android
        run: npx expo prebuild --platform android --clean

      # 6. Vérification de la configuration générée par Expo
      - name: Vérifier la configuration Android
        run: |
          echo "========================================"
          echo "       ANDROID SETTINGS.GRADLE"
          echo "========================================"
          cat android/settings.gradle

          echo ""
          echo "========================================"
          echo "       ANDROID BUILD.GRADLE"
          echo "========================================"
          cat android/build.gradle

          echo ""
          echo "========================================"
          echo "       GRADLE PROPERTIES"
          echo "========================================"
          cat android/gradle.properties

      # 7. Rendre Gradle exécutable
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      # 8. Nettoyage Gradle
      - name: Nettoyer le projet Android
        working-directory: android
        run: ./gradlew clean --no-daemon

      # 9. Construction de l'APK
      - name: Build APK avec Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. Vérifier que l'APK existe
      - name: Vérifier l'APK généré
        run: |
          echo "========================================"
          echo "         APK GÉNÉRÉ"
          echo "========================================"

          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK généré avec succès !"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK introuvable !"
            exit 1
          fi

      # 11. Sauvegarder l'APK comme artefact
      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
