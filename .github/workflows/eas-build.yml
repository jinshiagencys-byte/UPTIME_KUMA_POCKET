name: Build APK sur GitHub Actions

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du projet
      - name: Checkout le code
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 3. Java
      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Dépendances
      - name: Installation des dépendances NPM
        run: npm ci

      # 5. Génération Android avec Expo
      - name: Génération des fichiers natifs Android
        run: npx expo prebuild --platform android --clean

      # 6. Correction de la configuration Kotlin générée par Expo
      - name: Correction du plugin Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle")

          content = settings.read_text()

          # Ces plugins sont incorrectement appliqués directement
          # dans settings.gradle.
          content = content.replace(
              '\n// Required for Compose / Glance\n'
              'apply plugin: "org.jetbrains.kotlin.android"\n'
              'apply plugin: "kotlin-compose"\n',
              '\n'
          )

          settings.write_text(content)

          print("=== settings.gradle corrigé ===")
          print(content)
          PY

      # 7. Vérification de la configuration
      - name: Vérifier la configuration Android
        run: |
          echo "========================================"
          echo "SETTINGS.GRADLE"
          echo "========================================"
          cat android/settings.gradle

          echo ""
          echo "========================================"
          echo "BUILD.GRADLE"
          echo "========================================"
          cat android/build.gradle

          echo ""
          echo "========================================"
          echo "APP/BUILD.GRADLE"
          echo "========================================"
          cat android/app/build.gradle

      # 8. Gradle exécutable
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      # 9. Nettoyage
      - name: Nettoyer le projet Android
        working-directory: android
        run: ./gradlew clean --no-daemon

      # 10. Build APK
      - name: Build APK avec Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 11. Vérification APK
      - name: Vérifier l'APK généré
        run: |
          echo "========================================"
          echo "APK GÉNÉRÉ"
          echo "========================================"

          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK généré avec succès !"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK introuvable !"
            exit 1
          fi

      # 12. Upload APK
      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
