name: Build APK sur GitHub Actions

on:
  push:
    branches: [ main, 'fix/**' ]
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation des dépendances NPM
        run: npm ci

      - name: Génération du dossier natif Android
        run: npx expo prebuild --platform android --clean

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK Debug avec Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Sauvegarder l'APK généré comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
