name: Build APK sur GitHub Actions

on:
  push:
    branches: [ main, 'fix/**' ]
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation des dépendances NPM
        run: npm ci

      - name: Génération des fichiers natifs Android
        run: npx expo prebuild --platform android --clean

      - name: Injecter le plugin Kotlin dans build.gradle racine
        run: |
          BUILD_GRADLE="android/build.gradle"
          if ! grep -q "org.jetbrains.kotlin.android" "$BUILD_GRADLE"; then
            sed -i '/plugins {/a \    id "org.jetbrains.kotlin.android" version "1.9.24" apply false' "$BUILD_GRADLE"
          fi

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Build APK avec Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Sauvegarder l'APK généré comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
