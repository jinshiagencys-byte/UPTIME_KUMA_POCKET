name: Build APK sur GitHub Actions

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout le code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Node.js
      # ============================================================
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # 4. Dépendances
      # ============================================================
      - name: Installation des dépendances NPM
        run: npm ci


      # ============================================================
      # 5. Génération Android Expo
      # ============================================================
      - name: Génération des fichiers natifs Android
        run: npx expo prebuild --platform android --clean


      # ============================================================
      # 6. Corriger settings.gradle
      # ============================================================
      - name: Corriger settings.gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")

          if not path.exists():
              raise SystemExit("❌ android/settings.gradle introuvable")

          lines = path.read_text().splitlines()

          new_lines = []

          for line in lines:
              stripped = line.strip()

              # Ces plugins ne doivent pas être appliqués directement
              # depuis settings.gradle.
              if stripped in [
                  'apply plugin: "org.jetbrains.kotlin.android"',
                  "apply plugin: 'org.jetbrains.kotlin.android'",
                  'apply plugin: "kotlin-compose"',
                  "apply plugin: 'kotlin-compose'",
              ]:
                  print(f"Suppression : {line}")
                  continue

              new_lines.append(line)

          path.write_text("\n".join(new_lines) + "\n")

          print("✅ settings.gradle corrigé")
          PY


      # ============================================================
      # 7. Ajouter correctement le Compose Compiler Plugin
      # ============================================================
      - name: Configurer Kotlin Compose Compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle")

          if not path.exists():
              raise SystemExit("❌ android/build.gradle introuvable")

          content = path.read_text()

          # Plugin Compose Compiler compatible avec Kotlin 2.x
          plugin_line = '''
          plugins {
              id "org.jetbrains.kotlin.plugin.compose" version "2.2.21" apply false
          }
          '''

          # Ne pas ajouter plusieurs fois le plugin
          if "org.jetbrains.kotlin.plugin.compose" not in content:
              content = content.rstrip() + "\n\n" + plugin_line

          path.write_text(content)

          print("========================================")
          print("android/build.gradle")
          print("========================================")
          print(content)
          PY


      # ============================================================
      # 8. Appliquer le Compose Compiler au module app
      # ============================================================
      - name: Configurer le Compose Compiler dans app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("❌ android/app/build.gradle introuvable")

          content = path.read_text()

          plugin = 'id "org.jetbrains.kotlin.plugin.compose"'

          # Ajouter le plugin dans le bloc plugins
          if plugin not in content:

              if "plugins {" in content:
                  content = content.replace(
                      "plugins {",
                      'plugins {\n    id "org.jetbrains.kotlin.plugin.compose"',
                      1
                  )
              else:
                  content = (
                      'plugins {\n'
                      '    id "org.jetbrains.kotlin.plugin.compose"\n'
                      '}\n\n'
                      + content
                  )

          path.write_text(content)

          print("========================================")
          print("android/app/build.gradle")
          print("========================================")
          print(content)
          PY


      # ============================================================
      # 9. Vérification
      # ============================================================
      - name: Vérifier la configuration Kotlin et Compose
        run: |
          echo "========================================"
          echo "settings.gradle"
          echo "========================================"
          cat android/settings.gradle

          echo ""
          echo "========================================"
          echo "build.gradle"
          echo "========================================"
          cat android/build.gradle

          echo ""
          echo "========================================"
          echo "app/build.gradle"
          echo "========================================"
          cat android/app/build.gradle

          echo ""
          echo "========================================"
          echo "RECHERCHE DES PLUGINS"
          echo "========================================"

          grep -Rni \
            -E "kotlin|compose" \
            android/build.gradle \
            android/app/build.gradle \
            android/settings.gradle \
            || true


      # ============================================================
      # 10. Gradle exécutable
      # ============================================================
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew


      # ============================================================
      # 11. Version Gradle
      # ============================================================
      - name: Vérifier Gradle
        working-directory: android
        run: ./gradlew --version


      # ============================================================
      # 12. Nettoyage
      # ============================================================
      - name: Nettoyer le projet Android
        working-directory: android
        run: ./gradlew clean --no-daemon --stacktrace


      # ============================================================
      # 13. Build APK
      # ============================================================
      - name: Build APK avec Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 14. Vérification APK
      # ============================================================
      - name: Vérifier l'APK généré
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK" ]; then
            echo "========================================"
            echo "✅ APK GÉNÉRÉ AVEC SUCCÈS"
            echo "========================================"
            ls -lh "$APK"
          else
            echo "❌ APK introuvable"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi


      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
