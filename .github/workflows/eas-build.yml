name: Build APK sur GitHub Actions

on:
  push:
    branches: [ main, 'fix/**' ]
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration de Java (JDK 17 obligatoire pour Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache des dépendances Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Installation des dépendances NPM
        run: npm ci

      - name: Génération du dossier natif Android (Expo Prebuild)
        run: npx expo prebuild --platform android

      - name: Donner les permissions d'exécution au script Gradle
        run: chmod +x android/gradlew

      - name: Compiler l'APK Release sur GitHub
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sauvegarder l'APK généré comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
