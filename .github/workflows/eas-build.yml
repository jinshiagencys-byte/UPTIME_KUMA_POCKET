name: Build APK sur GitHub Action

on:
  push:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

jobs:
  build-android-github:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Récupération du code
      # ============================================================
      - name: Checkout le code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Configuration de Node.js
      # ============================================================
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      # ============================================================
      # 3. Configuration de Java
      # ============================================================
      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ============================================================
      # 4. Installation des dépendances
      # ============================================================
      - name: Installation des dépendances NPM
        run: npm ci


      # ============================================================
      # 5. Génération du projet Android
      # ============================================================
      - name: Génération des fichiers natifs Android
        run: npx expo prebuild --platform android --clean


      # ============================================================
      # 6. Correction de settings.gradle
      # ============================================================
      - name: Corriger settings.gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle")

          if not path.exists():
              print("❌ android/settings.gradle introuvable")
              raise SystemExit(1)

          lines = path.read_text().splitlines()
          new_lines = []

          for line in lines:
              stripped = line.strip()
              if stripped in [
                  'apply plugin: "org.jetbrains.kotlin.android"',
                  "apply plugin: 'org.jetbrains.kotlin.android'",
                  'apply plugin: "kotlin-compose"',
                  "apply plugin: 'kotlin-compose'",
              ]:
                  print(f"⚠️ Suppression : {line}")
                  continue
              new_lines.append(line)

          path.write_text("\n".join(new_lines) + "\n")
          PY


      # ============================================================
      # 7. Configuration du Compose Compiler (Racine)
      # ============================================================
      - name: Configurer Kotlin Compose Compiler (Root)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle")

          if not path.exists():
              print("❌ android/build.gradle introuvable")
              raise SystemExit(1)

          content = path.read_text()
          # Alignement sur le plugin Kotlin Compose valide
          plugin_id = 'org.jetbrains.kotlin.plugin.compose'
          plugin_line = f'    id "{plugin_id}" version "2.0.20" apply false'

          if plugin_id not in content:
              if "plugins {" in content:
                  content = content.replace("plugins {", f"plugins {{\n{plugin_line}", 1)
              elif "buildscript {" in content:
                  start = content.index("buildscript {")
                  depth = 0
                  end = None
                  for i in range(start, len(content)):
                      if content[i] == "{":
                          depth += 1
                      elif content[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is not None:
                      content = content[:end] + f"\n\nplugins {{\n{plugin_line}\n}}" + content[end:]
              else:
                  content = f"plugins {{\n{plugin_line}\n}}\n\n" + content

          path.write_text(content)
          PY


      # ============================================================
      # 8. Configuration du Compose Compiler (App)
      # ============================================================
      - name: Configurer Compose Compiler dans app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              print("❌ android/app/build.gradle introuvable")
              raise SystemExit(1)

          content = path.read_text()
          plugin_id = 'org.jetbrains.kotlin.plugin.compose'
          plugin_line = f'    id "{plugin_id}"'

          if plugin_id not in content:
              if "plugins {" in content:
                  content = content.replace("plugins {", f"plugins {{\n{plugin_line}", 1)
              else:
                  content = f"plugins {{\n{plugin_line}\n}}\n\n" + content

          path.write_text(content)
          PY


      # ============================================================
      # 9. Vérification de la configuration
      # ============================================================
      - name: Vérifier la configuration Android
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo "=== build.gradle ==="
          cat android/build.gradle
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle


      # ============================================================
      # 10. Nettoyage des plugins incorrects dans settings.gradle
      # ============================================================
      - name: Vérifier settings.gradle
        run: |
          if grep -nE 'apply plugin.*org\.jetbrains\.kotlin\.android' android/settings.gradle; then
            echo "❌ org.jetbrains.kotlin.android est encore présent dans settings.gradle"
            exit 1
          fi

          if grep -nE 'apply plugin.*kotlin-compose' android/settings.gradle; then
            echo "❌ kotlin-compose est encore présent dans settings.gradle"
            exit 1
          fi

          echo "✅ settings.gradle est correct."


      # ============================================================
      # 11. Rendre Gradle exécutable
      # ============================================================
      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew


      # ============================================================
      # 12. Vérifier la version de Gradle
      # ============================================================
      - name: Vérifier Gradle
        working-directory: android
        run: ./gradlew --version


      # ============================================================
      # 13. Nettoyage
      # ============================================================
      - name: Nettoyer le projet Android
        working-directory: android
        run: ./gradlew clean --no-daemon --stacktrace


      # ============================================================
      # 14. Construction de l'APK
      # ============================================================
      - name: Build APK avec Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace


      # ============================================================
      # 15. Vérification de l'APK
      # ============================================================
      - name: Vérifier l'APK généré
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK" ]; then
            echo "✅ APK généré avec succès !"
            ls -lh "$APK"
          else
            echo "❌ APK introuvable !"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi


      # ============================================================
      # 16. Upload de l'APK
      # ============================================================
      - name: Sauvegarder l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
